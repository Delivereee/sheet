<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA 라우팅 처리
      // 현재 URL 경로를 sessionStorage에 저장하고 루트로 리다이렉트
      (function() {
        var path = window.location.pathname;
        
        // /sheet으로 시작하는 경로만 처리
        if (path.startsWith('/sheet')) {
          // /sheet 이후의 경로를 추출
          var route = path.substring('/sheet'.length) || '/';
          
          // 쿼리 파라미터가 있다면 포함
          if (window.location.search) {
            route += window.location.search;
          }
          
          // 해시가 있다면 포함
          if (window.location.hash) {
            route += window.location.hash;
          }
          
          // sessionStorage에 원래 경로 저장
          sessionStorage.setItem('spa-redirect', route);
          
          // 루트 경로로 리다이렉트
          window.location.replace('/sheet/');
        }
      })();
    </script>
  </head>
  <body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h2>Redirecting...</h2>
      <p>Please wait while we redirect you to the correct page.</p>
    </div>
  </body>
</html>
